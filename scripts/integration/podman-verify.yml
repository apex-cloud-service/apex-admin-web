x-java: &java
  image: docker.io/library/eclipse-temurin:21-jre
  pull_policy: never
  entrypoint: ["sh", "-ec", "cp /input.jar /tmp/apex.jar; exec java -XX:ActiveProcessorCount=2 -Xmx640m -jar /tmp/apex.jar"]
x-env: &env
  SPRING_PROFILES_ACTIVE: dev
  NACOS_CONFIG_ENABLED: "false"
  NACOS_DISCOVERY_ENABLED: "false"
  NACOS_REGISTER_ENABLED: "false"
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"
  SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
  SPRING_DATA_REDIS_HOST: redis
  REDIS_HOST: redis
  DB_HOST: mysql
  DB_USERNAME: root
  DB_PASSWORD: ${VERIFY_DB_PASSWORD}
  JWT_SECRET: ${VERIFY_JWT}
  CONFIG_ENCRYPTION_KEY: ${VERIFY_CONFIG_KEY}
  SECURITY_CONFIG_ENCRYPTION_KEY: ${VERIFY_CONFIG_KEY}
  APEX_SECURITY_DATA_ENCRYPTION_KEY: ${VERIFY_AES}
  APEX_DATA_ENCRYPTION_KEY: ${VERIFY_AES}
  SECURITY_ENCRYPTION_KEY: ${VERIFY_AES}
  APEX_CONFIG_ENCRYPTION_KEY: ${VERIFY_AES}
  APEX_INTERNAL_AUTH_SECRET: ${VERIFY_JWT}
  JWKS_REMOTE_URL: http://apex-auth-service:8081/.well-known/jwks.json
  JWKS_REFRESH_INTERVAL_SECONDS: "10"
services:
  rocketmq-namesrv:
    profiles: [rocketmq]
    image: docker.io/apache/rocketmq:5.3.1
    pull_policy: never
    environment:
      MAX_HEAP_SIZE: 256m
      HEAP_NEWSIZE: 128m
    command: ["sh", "-ec", "mkdir -p /home/rocketmq/logs; exec sh mqnamesrv"]
  rocketmq-broker:
    profiles: [rocketmq]
    image: docker.io/apache/rocketmq:5.3.1
    pull_policy: never
    tmpfs: [/home/rocketmq/store]
    environment:
      MAX_HEAP_SIZE: 512m
      HEAP_NEWSIZE: 128m
      JAVA_OPT_EXT: -XX:ActiveProcessorCount=2
    command:
      - sh
      - -ec
      - |
        mkdir -p /home/rocketmq/logs
        set -- $$(hostname -i)
        printf 'brokerIP1=%s\nstorePathRootDir=/home/rocketmq/store\nstorePathCommitLog=/home/rocketmq/store/commitlog\nmappedFileSizeCommitLog=16777216\n' "$$1" > /tmp/broker.conf
        exec sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf
  rocketmq-publisher:
    profiles: [rocketmq]
    image: docker.io/apache/rocketmq:5.3.1
    pull_policy: never
    entrypoint: ["sh", "-ec"]
    command: ["printf '%s' \"$$VERIFY_MQ_PAYLOAD\" > /tmp/fe029-push.json; timeout 45 sh mqadmin sendMessage -n rocketmq-namesrv:9876 -t apex-notification-topic -p \"$$(cat /tmp/fe029-push.json)\""]
    environment:
      VERIFY_MQ_PAYLOAD: ${VERIFY_MQ_PAYLOAD:-}
  mysql:
    image: docker.io/library/mysql:9.0
    pull_policy: never
    tmpfs: [/var/lib/mysql]
    environment:
      MYSQL_ROOT_PASSWORD: ${VERIFY_DB_PASSWORD}
      MYSQL_DATABASE: apex_system
  redis:
    image: docker.io/library/redis:7-alpine
    pull_policy: never
    tmpfs: [/data]
  apex-auth-service:
    <<: *java
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-auth-service/target/apex-auth-service-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      DB_NAME: apex_auth
      AUTH_CENTER_LOGIN_TENANT: default
      SPRING_APPLICATION_JSON: '{"auth-center":{"login-tenant":"default","login":{"default-tenant":"default"}}}'
      SPRING_DATASOURCE_URL: &auth jdbc:mysql://mysql:3306/apex_auth?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/apex_auth?sslMode=DISABLED&allowPublicKeyRetrieval=true
      SPRING_FLYWAY_URL: *auth
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: ${VERIFY_DB_PASSWORD}
      TOKEN_ENCRYPTION_KEY: ${VERIFY_AES}
      AUTH_CENTER_OAUTH2_PRIVATE_KEY: ${VERIFY_RSA_PRIVATE}
      AUTH_CENTER_OAUTH2_PUBLIC_KEY: ${VERIFY_RSA_PUBLIC}
      TENANT_CHECK_BASE_URL: http://apex-system-service:8082
      TENANT_CHECK_TIMEOUT_MILLIS: "12000"
  apex-system-service:
    <<: *java
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-system-service/target/apex-system-service-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      DB_NAME: apex_system
      DB_MASTER_URL: &system jdbc:mysql://mysql:3306/apex_system?allowPublicKeyRetrieval=true&useSSL=false
      DB_SLAVE_URL: *system
      DB_MASTER_PASSWORD: ${VERIFY_DB_PASSWORD}
      DB_SLAVE_PASSWORD: ${VERIFY_DB_PASSWORD}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: *system
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: ${VERIFY_DB_PASSWORD}
      SPRING_MAIL_HOST: localhost
      CORS_ALLOWED_ORIGINS: http://apex-admin-web
      APEX_JWKS_REMOTE_URL: http://apex-auth-service:8081/.well-known/jwks.json
      APEX_JWKS_REFRESH_INTERVAL_SECONDS: "10"
      APEX_OVERVIEW_SOURCES_FILE: http://apex-file-service:8085
      APEX_OVERVIEW_SOURCES_WORKFLOW: http://apex-workflow-service:8093
      APEX_OVERVIEW_SOURCES_INTEGRATION: http://apex-integration-service:8094
      APEX_OVERVIEW_TIMEOUT_MILLIS: "8000"
      ROCKETMQ_NAMESERVER: ${VERIFY_ROCKETMQ_NAMESERVER:-127.0.0.1:9876}
      APEX_MQ_CONSUMER_ENABLED: ${VERIFY_MQ_CONSUMER_ENABLED:-false}
  apex-office-service:
    <<: *java
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-office-service/target/apex-office-service-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_office?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_PASSWORD: ${VERIFY_DB_PASSWORD}
      OFFICE_MESSAGE_ALLOWED_ORIGINS: http://apex-admin-web
  apex-workflow-service:
    <<: *java
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-workflow-service/target/apex-workflow-service-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_workflow?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${VERIFY_DB_PASSWORD}
  apex-file-service:
    <<: *java
    tmpfs: [/uploads]
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-file-service/target/apex-file-service-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_file?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${VERIFY_DB_PASSWORD}
      STORAGE_LOCAL_BASE_PATH: /uploads
  apex-integration-service:
    <<: *java
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-integration-service/target/apex-integration-service-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      DB_NAME: apex_integration
      SPRING_DATASOURCE_URL: &integration jdbc:mysql://mysql:3306/apex_integration?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: *integration
      APEX_CREDENTIAL_ENCRYPTION_KEY: ${VERIFY_CONFIG_KEY}
  apex-gateway:
    <<: *java
    volumes: ["${BACKEND_ROOT}/apex-services-bom/apex-gateway/target/apex-gateway-1.3.1.jar:/input.jar:ro"]
    environment:
      <<: *env
      ROUTE_AUTH_URI: http://apex-auth-service:8081
      ROUTE_SYSTEM_URI: http://apex-system-service:8082
      CORS_ALLOWED_ORIGINS: http://apex-admin-web
      ROUTE_OFFICE_URI: http://apex-office-service:8084
      ROUTE_OFFICE_MESSAGE_URI: http://apex-office-service:8084
      ROUTE_OFFICE_WS_URI: ws://apex-office-service:8084
      ROUTE_WORKFLOW_URI: http://apex-workflow-service:8093
      ROUTE_FILE_URI: http://apex-file-service:8085
      ROUTE_INTEGRATION_URI: http://apex-integration-service:8094
      SPRING_APPLICATION_JSON: '{"resilience4j":{"timelimiter":{"instances":{"authService":{"timeout-duration":"24s"},"systemService":{"timeout-duration":"14s"},"officeService":{"timeout-duration":"10s"},"workflowService":{"timeout-duration":"12s"},"fileService":{"timeout-duration":"12s"},"integrationService":{"timeout-duration":"12s"}}}}}'
  apex-admin-web:
    image: ${VERIFY_FRONTEND_IMAGE}
    pull_policy: never
    volumes: ["${FRONTEND_ROOT}/container/nginx.conf:/etc/nginx/conf.d/default.conf.template:ro"]
    environment:
      API_PROXY_PASS: http://apex-gateway:8080
  browser:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    pull_policy: never
    tmpfs: [/tmp]
    working_dir: /workspace
    command: ["timeout", "420", "node", "scripts/integration/browser-auth-smoke.mjs", "--business", "--domains", "--notification-fixtures", "${VERIFY_BROWSER_MODE:-}"]
    volumes: ["${FRONTEND_ROOT}:/workspace:ro"]
    environment:
      NO_PROXY: apex-admin-web,localhost,127.0.0.1
      no_proxy: apex-admin-web,localhost,127.0.0.1
      TEST_LOGIN_PASSWORD: ${VERIFY_BROWSER_PASSWORD}
      VERIFY_SSE_MARKER: ${VERIFY_SSE_MARKER:-}
  frontend-test:
    profiles: [frontend-test]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    pull_policy: never
    tmpfs: [/test]
    working_dir: /test
    volumes: ["${FRONTEND_ROOT}:/source:ro"]
    environment:
      PLAYWRIGHT_USE_PREVIEW: '1'
    command:
      - bash
      - -euo
      - pipefail
      - -c
      - |
        printf 'Preparing isolated frontend workspace\n'
        tar -C /source --exclude=.git --exclude=node_modules --exclude=dist --exclude=reports --exclude=test-results -cf - . | tar -xf -
        printf 'Installing locked Linux dependencies (limit: 5 minutes)\n'
        status=0
        timeout --kill-after=10s 300s npm ci --no-audit --no-fund || status=$$?
        if [ "$$status" -eq 124 ] || [ "$$status" -eq 137 ]; then
          printf 'Dependency installation terminated or exceeded its time limit (exit %s)\n' "$$status" >&2
        fi
        [ "$$status" -eq 0 ] || exit "$$status"
        npm test -- --run
        npm run build
        npm run test:e2e -- --workers=1 --retries=0 --trace=off
