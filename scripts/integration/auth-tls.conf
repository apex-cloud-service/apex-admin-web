# 隔离验证专用 TLS 终结：仅栈内可达，不发布宿主端口
# 由 podman-verify-authorized.yml 以只读方式挂载到 nginx 容器。
# 证书来自 prepare-authorization.sh 生成的自签 CA（同一 CA 导入各服务 truststore）。
#
# 注意：nginx 启动时上游可能尚未注册 DNS（auth-service 未启动），因此用
# 启动脚本轮询解析成功后再启动 nginx，而不是让 nginx 直接 emerg 退出。
server {
    listen 8443 ssl;
    server_name apex-auth-tls;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 授权快照是只读查询；只允许 GET，避免验证代理被用作其他用途
    if ($request_method !~ ^(GET)$) {
        return 405;
    }

    location / {
        proxy_pass         http://apex-auth-service:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}