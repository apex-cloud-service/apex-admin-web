# Apex Admin Web - Nginx 站点配置
# 模板变量 ${API_PROXY_PASS} 由 docker-entrypoint.sh 的 envsubst 渲染后生成 default.conf

server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # 内容安全与缓存
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 带 hash 指纹的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 前端单页应用 History 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端业务与管理接口反向代理
    location ~ ^/oauth2/(authorize|token)$ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # 授权同意端点：仅 POST 反代后端；GET 是前端 SPA 同意页路由，回退 index.html
    location = /oauth2/consent {
        if ($request_method = POST) {
            proxy_pass         ${API_PROXY_PASS};
        }
        try_files /index.html =404;
    }
    # 认证中心前缀（登录 MFA 二步验证、在线会话、密码找回）
    location /auth/v1/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /auth/v2/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # 集成中心与物联网（仅 API 版本前缀，避免与菜单目录 SPA 路由 /integration 冲突）
    location /integration/v1/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # 站内信 WebSocket 握手（需 Upgrade/Connection 头；票据 30s 一次性，连接寿命上限 1h）
    location = /api/v1/messages/ws {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /api/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin-api/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
