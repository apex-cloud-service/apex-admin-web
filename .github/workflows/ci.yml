name: ci

# 分支模型：dev（日常开发）→ test（验收）→ master（生产）；分支策略变更时同步此列表
on:
  push:
    branches: [ master, test, dev ]
  pull_request:
    branches: [ master, test ]
  workflow_dispatch:

jobs:
  # 治理脚本均以 --strict 运行：命中问题即失败，不再只告警。
  # 记忆台账校验使用 --range 覆盖提交范围（checkout 后无暂存区，必须用 range）。
  docs-and-rules:
    name: 文档与红线门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --range 需要历史提交与 base 分支引用
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 文档治理自检
        run: bash scripts/governance/verify-docs.sh --strict

      - name: 文档断链检查
        run: bash scripts/governance/check-doc-refs.sh --strict

      - name: 前端红线扫描
        run: bash scripts/governance/audit-frontend-rules.sh --strict

      - name: 治理脚本自测
        run: bash scripts/governance/__tests__/governance-selftest.sh

      - name: 记忆台账校验（提交范围）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}...${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && git rev-parse --verify --quiet "${HEAD_SHA}^" >/dev/null; then
            RANGE="${HEAD_SHA}^..${HEAD_SHA}"
          else
            echo "[memory] 缺少有效基线，无法校验；需确定初始登记基线，不静默跳过" >&2
            exit 1
          fi
          bash scripts/governance/check-memory-sync.sh --strict --range "$RANGE"

  build:
    name: 构建（vue-tsc + vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 锁定的 Vitest 5 要求 ^22.12 / ^24 / >=26，Node 20 不再满足。
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
