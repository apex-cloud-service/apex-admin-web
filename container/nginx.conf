# ==============================================================================
# Apex Admin Web · Nginx 站点配置
# ------------------------------------------------------------------------------
# 文件位置：仓库 container/nginx.conf
# 容器位置：/etc/nginx/conf.d/default.conf.template
# 生效方式：container/container-entrypoint.sh 用 envsubst 仅展开 ${API_PROXY_PASS}，
#           渲染为 /etc/nginx/conf.d/default.conf 后由 nginx 加载。
#
# 职责：
#   1) 托管 SPA 构建产物（dist → /usr/share/nginx/html），并为 History 路由回退；
#   2) 作为浏览器访问后端的唯一同域入口，把各业务前缀反向代理到网关；
#   3) 为 SSE / WebSocket 长连接提供专用转发参数。
#
# 部署形态：
#   - 同域部署（默认）：VITE_API_BASE_URL 留空，浏览器请求相对路径，由本文件反代；
#   - 跨域部署：使用 API 基地址的请求可直连网关，静态资源仍由本 Nginx 托管；
#     OAuth2 授权等同源相对路径请求仍可能经过本反代。
#
# 模板变量约定：
#   ${API_PROXY_PASS} 必须是「网关」的单一 upstream，且不带尾部斜杠。
#   带尾部斜杠会触发 Nginx 的 URI 替换语义，把 /api/v1/... 改写为 /...；
#   指向具体领域服务则绕过网关的鉴权、套餐与能力门禁。
#
# 维护约定：
#   - 新增后端前缀时，必须同步网关路由、vite.config.ts 代理与 AGENTS.md 前缀表；
#   - 长连接用精确匹配 location，将专用参数限定在目标端点；更长前缀也按最长匹配选择。
#   - /internal/v1/** 为集群内部端点，网关已拒绝外部访问，Nginx 不提供任何放行；
#   - 反代头保持最小集，租户上下文由后端从令牌解析，不信任前端附加的身份信息。
# ==============================================================================

server {
    # 容器内监听 80；TLS、HTTP/2、HSTS 由外层 Ingress / SLB 终止，本层不做跳转
    listen       80;
    server_name  _;

    # SPA 静态资源根目录（Containerfile 从 build 阶段复制 /app/dist）
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 请求体上限
    # --------------------------------------------------------------------------
    # 前端单文件上限 10MB（src/settings.ts MAX_UPLOAD_SIZE），分片上传块大小 5MB。
    # Nginx 默认仅 1m，1–10MB 的 multipart 请求会在到达网关前被直接拒绝为 413，
    # 前端只能看到无响应体的错误，属于上线阻断项。
    # 取 20m：覆盖 10MB 文件 + multipart 边界/表单字段开销，同时远大于 5MB 分片块。
    # 调整时必须三处联动：本值、MAX_UPLOAD_SIZE、后端 FILE_MAX_SIZE_BYTES（默认 10MB）。
    client_max_body_size 20m;

    # --------------------------------------------------------------------------
    # 基础安全响应头
    # --------------------------------------------------------------------------
    # 注意：Nginx 的 add_header 不会与子级 location 合并 —— 只要子级出现任意
    # add_header，父级这里的头就会全部失效。因此静态资源 location 内重复声明了安全头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --------------------------------------------------------------------------
    # 静态资源：带内容指纹的产物长缓存
    # --------------------------------------------------------------------------
    # Vite 产物文件名含 hash（vite.config.ts 的 rollup 输出规则）：
    #   js/、css/、images/、fonts/、media/ 为常规产物目录，assets/ 为兜底目录。
    # 目录清单必须与实际构建输出一致，只写 /assets/ 会让 js/css 退化为无缓存。
    # 发布时需清空旧目录，避免残留文件命中缓存。
    location ~* ^/(assets|js|css|images|fonts|media)/ {
        # 重复安全头：本块存在 add_header，父级声明不会继承（原因见上）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 只写显式 Cache-Control，不使用 expires 指令：
        # expires 会额外输出一份 Cache-Control: max-age=...，造成重复头。
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # SPA History 路由回退
    # --------------------------------------------------------------------------
    # 静态文件优先；未命中时回退 index.html，交由 vue-router 解析。
    # 前缀 location 由 Nginx 按最长匹配选择，与本块书写顺序无关；
    # 精确匹配优先，正则 location 的排列顺序影响匹配结果。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # OAuth2 授权与令牌端点
    # --------------------------------------------------------------------------
    # 仅代理标准协议端点；/oauth2/consent 单独处理（见下）。
    # 这些端点为公开端点，鉴权由后端按 client_id / 授权码校验。
    location ~ ^/oauth2/(authorize|token)$ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 授权同意端点（POST 反代，GET 走 SPA）
    # --------------------------------------------------------------------------
    # 同一路径承担两种语义：
    #   - GET  /oauth2/consent：前端同意页（vue-router 路由），必须回退 index.html；
    #   - POST /oauth2/consent：后端提交接口（form-urlencoded）。
    # 仅对 POST 反代，其余方法交给 try_files，避免把页面请求打到后端。
    location = /oauth2/consent {
        if ($request_method = POST) {
            proxy_pass         ${API_PROXY_PASS};
        }
        try_files /index.html =404;
    }

    # --------------------------------------------------------------------------
    # 认证中心前缀
    # --------------------------------------------------------------------------
    # /auth/v1：登录、MFA 二步验证、令牌刷新、在线会话、密码找回；
    # /auth/v2：密码找回等新版端点。
    # 使用带版本号的前缀，而非裸 /auth，避免与前端路由冲突。
    location /auth/v1/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /auth/v2/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 集成中心与物联网
    # --------------------------------------------------------------------------
    # 仅匹配 /integration/v1/ 版本前缀，不能写成 /integration，
    # 否则会把前端菜单目录路由 /integration（SPA 页面）也反代到后端。
    location /integration/v1/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 站内信 WebSocket 握手
    # --------------------------------------------------------------------------
    # 精确匹配该端点并发起协议升级：
    #   - Upgrade / Connection 头是 101 Switching Protocols 的前提；
    #   - 票据 30s 内一次性有效，连接寿命上限 1h，由后端控制；
    #   - 读写超时需与后端心跳周期匹配，避免空闲时被 Nginx 提前断开。
    location = /api/v1/messages/ws {
        access_log         off;
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 通知中心 SSE 长连接
    # --------------------------------------------------------------------------
    # 前端用 fetch + ReadableStream（EventSource 无法携带 Authorization 头）：
    #   - proxy_buffering off：事件产生即下发，避免被 Nginx 缓冲成整批；
    #   - proxy_cache off：SSE 不可缓存；
    #   - Connection ""：清除 Connection 头，保持 HTTP/1.1 长连接；
    #   - 后端 30s 心跳，读写超时必须显著大于心跳间隔（取 3600s）。
    # 使用精确匹配，将长连接参数限定在该 SSE 端点；更长前缀不会被 /api/ 前缀覆盖。
    location = /api/v1/notifications/stream {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 业务接口前缀
    # --------------------------------------------------------------------------
    # /api/：认证、用户、文件、站内信、通知、办公平台接入、开放应用、租户套餐、
    #        能力运营、工作流定义、运维健康、文件分享、会议室与统一通知等；
    # /admin-api/：角色/权限/菜单、消息模板与组织同步等管理接口；
    # 开放应用 scope 目录位于 /api/v1/open-apps/scopes。
    # 两者均转发到同一网关，由网关按路由与鉴权规则分发，Nginx 不做路径白名单。
    location /api/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin-api/ {
        proxy_pass         ${API_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
